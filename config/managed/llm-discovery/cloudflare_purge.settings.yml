auth_method: bearer
storage_method: plain
auto_purge_enabled: true
auto_purge_entity_types:
  - node
  - taxonomy_term
auto_purge_use_queue: true
purge_everything_on_flush: false
queue_max_age_enabled: true
queue_max_age: 900
tag_prefix: stinchcombe
auto_purge_filter_header_tags: true
auto_purge_hash_tags: false
auto_purge_hash_length: 16
auto_purge_header_max_bytes: 7168
rate_limit_enabled: true
rate_limit_per_minute: 5
logging_enabled: true
history_limit: 100
