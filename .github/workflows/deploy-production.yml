name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  PROJECT_ID: stinchcombe-list
  REGION: northamerica-northeast1
  SERVICE: stinchcombe-list
  IMAGE: northamerica-northeast1-docker.pkg.dev/stinchcombe-list/stinchcombe-list/drupal:${{ github.sha }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/718333151594/locations/global/workloadIdentityPools/github-actions/providers/stinchcombe-list
          service_account: github-deployer@stinchcombe-list.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Cloud Run revision
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          service: ${{ env.SERVICE }}
          image: ${{ env.IMAGE }}

      - name: Update maintenance job image and command
        run: >-
          gcloud run jobs update "${SERVICE}-maintenance"
          --project="${PROJECT_ID}"
          --region="${REGION}"
          --image="${IMAGE}"
          --command=/var/www/html/scripts/maintenance.sh
          --args=deploy
          --quiet

      - name: Detect Cloudflare secret bindings
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "${SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json)"
          job_json="$(gcloud run jobs describe "${SERVICE}-maintenance" --project="${PROJECT_ID}" --region="${REGION}" --format=json)"
          if jq -e '.spec.template.spec.containers[0].env | map(.name) | contains(["CLOUDFLARE_ZONE_ID", "CLOUDFLARE_API_TOKEN"])' <<<"${service_json}" >/dev/null \
            && jq -e '.spec.template.spec.template.spec.containers[0].env | map(.name) | contains(["CLOUDFLARE_ZONE_ID", "CLOUDFLARE_API_TOKEN"])' <<<"${job_json}" >/dev/null; then
            echo 'configured=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'Cloudflare secret bindings are absent; the module will remain runtime-disabled.'
            echo 'configured=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Apply database updates and managed configuration
        id: maintenance
        run: |
          set -euo pipefail
          execution="$(gcloud run jobs execute "${SERVICE}-maintenance" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --args=deploy \
            --wait \
            --format='value(metadata.name)')"
          echo "execution=${execution}" >> "${GITHUB_OUTPUT}"

      - name: Verify production website
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            https://stinchcombelist.com/ >/dev/null
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            --output "${RUNNER_TEMP}/stinchcombe-llms.txt" \
            https://stinchcombelist.com/llms.txt
          grep -Eq '^# .+' "${RUNNER_TEMP}/stinchcombe-llms.txt"

      - name: Run external LLM discovery acceptance suite
        shell: pwsh
        run: |
          $arguments = @{
            ProjectId = $env:PROJECT_ID
            Region = $env:REGION
            MaintenanceJob = "$($env:SERVICE)-maintenance"
          }
          if ('${{ steps.cloudflare.outputs.configured }}' -eq 'true') {
            $arguments.PurgeStale = $true
          }
          & ./scripts/Test-LlmDiscovery.ps1 @arguments

      - name: Verify final Cloud Run state
        shell: bash
        run: |
          set -euo pipefail
          service_image="$(gcloud run services describe "${SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.containers[0].image)')"
          job_image="$(gcloud run jobs describe "${SERVICE}-maintenance" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          revision="$(gcloud run services describe "${SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.latestReadyRevisionName)')"
          test "${service_image}" = "${IMAGE}"
          test "${job_image}" = "${IMAGE}"
          test -n "${revision}"
          echo "Revision ${revision} is Ready; maintenance execution ${{ steps.maintenance.outputs.execution }} completed."
